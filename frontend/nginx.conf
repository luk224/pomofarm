server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    # Resolve `app` at request time, not once at start: nginx can start before the game server does (after a reboot of the host)
    # and keeps working if the server's container is restarted and gets another address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $game_server http://app:8080;
    proxy_pass $game_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
